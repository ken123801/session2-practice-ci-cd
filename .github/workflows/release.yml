name: CI/CD Pipeline
on:
  push:
    tags:
      - 'v*'  # 只要推送以 v 开头的标签（如 v1.0），就触发任务
jobs:
  test-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pytest transformers torch
      - name: Run tests
        run: pytest test_main.py  # 机器人会在这里跑测试
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success() # 只有测试成功才会发布